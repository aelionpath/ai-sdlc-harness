[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-harness"
version = "1.0.0"
description = "A deterministic repo-local control layer for bounded AI-assisted software changes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Aelion Path" }
]
keywords = ["ai", "sdlc", "cli", "developer-tools"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "setuptools>=77.0.3",
  "wheel",
]

[project.urls]
Homepage = "https://github.com/aelionpath/ai-sdlc-harness"
Repository = "https://github.com/aelionpath/ai-sdlc-harness"
Documentation = "https://github.com/aelionpath/ai-sdlc-harness/tree/main/docs"
Issues = "https://github.com/aelionpath/ai-sdlc-harness/issues"
Changelog = "https://github.com/aelionpath/ai-sdlc-harness/releases"
Security = "https://github.com/aelionpath/ai-sdlc-harness/security/policy"

[project.scripts]
ai-sdlc = "ai_sdlc_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/ai-sdlc-harness/templates/task" = [
  "templates/task/task.md",
  "templates/task/acceptance.md",
  "templates/task/architecture-notes.md",
  "templates/task/coupling-notes.md",
  "templates/task/test-contract.md",
  "templates/task/verification.md",
  "templates/task/evidence.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
